stages:
- stage: Default
  jobs:
  - job: Default
    pool:
      vmImage: ${{ parameters.vmImage }}
      steps:
      - task: UseDotNet@2
        inputs:
          packageType: 'sdk'
          version: '3.1.300'

      - task: DotNetCoreCLI@2
        displayName: Restore
        inputs:
          command: 'restore'
          projects: ${{ parameters.restoreBuildProjects }}
          feedsToUse: 'select'
          vstsFeed: '9072218a-afc6-4668-aee7-e7769e98c15f'

      - task: DotNetCoreCLI@2
        displayName: Build
        inputs:
          projects: ${{ parameters.restoreBuildProjects}}
          arguments: '--configuration ${{ parameters.buildConfiguration }} --framework=${{ parameters.targetFramework }}'

      - task: DotNetCoreCLI@2
        displayName: Publish
        inputs:
          command: 'publish'
          publishWebProjects: true
          arguments: '-c ${{ parameters.buildConfiguration }} -f ${{ parameters.targetFramework }} -o $(Build.ArtifactStagingDirectory)'
          modifyOutputPath: false

      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Build.ArtifactStagingDirectory)'
          ArtifactName: 'drop'
          publishLocation: 'Container'