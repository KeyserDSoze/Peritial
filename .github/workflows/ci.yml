name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: peritial
          POSTGRES_PASSWORD: local-only-postgres
          POSTGRES_DB: peritial
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U peritial -d peritial"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Peritial.slnx
      - name: Build API/MCP entrypoint explicitly
        run: dotnet build src/backend/Applications/Peritial.Applications.csproj --configuration Release --no-restore
      - run: dotnet test Peritial.slnx --no-restore --configuration Release
        env:
          PERITIAL_TEST_POSTGRES: Host=localhost;Port=5432;Database=peritial;Username=peritial;Password=local-only-postgres
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker/compose.yml config --quiet
      - run: docker compose -f docker/compose.yml up --build -d
      - name: HTTP readiness
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/health/live; then exit 0; fi
            sleep 5
          done
          docker compose -f docker/compose.yml logs
          exit 1
      - name: Wait for Keycloak OIDC discovery
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://localhost:8081/realms/peritial/.well-known/openid-configuration > /dev/null; then exit 0; fi
            sleep 5
          done
          echo "Keycloak discovery unavailable"
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
        working-directory: src/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: src/frontend
      - name: Authenticated OAuth + MCP integration
        run: npm run test:e2e
        working-directory: src/frontend
        env:
          E2E_FULL_STACK: "1"
          E2E_BASE_URL: http://localhost:5173
      - name: Verify S3, Azure Blob and ClamAV scanner against real local services
        run: |
          docker compose -f docker/compose.yml --profile azure-test up -d azurite
          for i in $(seq 1 30); do
            if curl --silent --max-time 2 --output /dev/null http://localhost:10000/devstoreaccount1; then break; fi
            sleep 1
          done
          docker compose -f docker/compose.yml --profile test run -T --rm \
            -e PERITIAL_TEST_S3_ENDPOINT=http://seaweedfs:8333 \
            -e PERITIAL_TEST_AZURITE_ENDPOINT=http://azurite:10000/devstoreaccount1 \
            -e PERITIAL_TEST_CLAMD_HOST=clamav \
            tests dotnet test tests/backend/Peritial.Infrastructures.Tests/Peritial.Infrastructures.Tests.csproj \
            --filter "FullyQualifiedName~ObjectStoreContractTests|FullyQualifiedName~ClamdScannerContractTests" \
            --logger "console;verbosity=normal"
      - name: Verify durable REST/MCP audit via privileged CI PostgreSQL role
        run: |
          result=$(docker compose -f docker/compose.yml exec -T postgres \
            psql -U peritial -d peritial -Atqc "
              SELECT
                (SELECT count(*) FROM security_audit WHERE action='perizia.create' AND outcome='succeeded') >= 2
                AND (SELECT count(*) FROM security_audit WHERE action='document.ingest' AND outcome='succeeded') >= 1
                AND (SELECT count(*) FROM security_audit WHERE action='document.scan' AND outcome='denied') >= 1
                AND (SELECT count(*) FROM security_audit WHERE action='authorization.forbidden' AND outcome='denied') >= 1
                AND (SELECT count(*) FROM security_audit WHERE action='perizia.create' AND outcome='denied') >= 1
                AND (SELECT count(*) FROM security_audit WHERE subject = '') = 0
                AND (SELECT count(*) FROM upload_intents) = 0
                AND (SELECT count(*) FROM documents WHERE file_name='retry-proof.pdf') = 2
                AND (SELECT count(*) FROM security_audit WHERE action='document.ingest'
                     AND outcome='succeeded' AND resource_id IN
                       (SELECT id FROM documents WHERE file_name='retry-proof.pdf')) = 2;
            ")
          if [ "$result" != "t" ]; then
            echo "Required persisted REST/MCP security audit events are missing."
            docker compose -f docker/compose.yml exec -T postgres \
              psql -U peritial -d peritial -Atc \
              "SELECT action,outcome,count(*) FROM security_audit GROUP BY action,outcome ORDER BY action,outcome"
            exit 1
          fi
      - name: Verify recovery after abrupt API kill against PostgreSQL and real SeaweedFS
        run: |
          # The API/worker are stopped with SIGKILL, then an abandoned
          # uploaded object and expired durable intent are seeded using the
          # same app role and S3 adapter. Restart should recover on startup.
          docker compose -f docker/compose.yml kill --signal SIGKILL api
          docker compose -f docker/compose.yml --profile test run -T --rm \
            -e PERITIAL_TEST_RESTART=1 \
            -e PERITIAL_TEST_S3_ENDPOINT=http://seaweedfs:8333 \
            tests dotnet test tests/backend/Peritial.Infrastructures.Tests/Peritial.Infrastructures.Tests.csproj \
            --filter FullyQualifiedName~UploadRestartContractTests.Seed_abandoned_object_after_api_is_abruptly_stopped \
            --logger "console;verbosity=normal"
          docker compose -f docker/compose.yml start api
          ready=0
          for i in $(seq 1 60); do
            if curl --fail --silent http://localhost:8080/health/live >/dev/null; then ready=1; break; fi
            sleep 2
          done
          test "$ready" = "1"
          recovered=0
          for i in $(seq 1 60); do
            count=$(docker compose -f docker/compose.yml exec -T postgres \
              psql -U peritial -d peritial -Atqc \
              "SELECT count(*) FROM upload_intents WHERE tenant_id='55f4fddc-dca2-4c30-bef7-a8fcaf4ae611' AND document_id='eb02935f-119a-4ed2-8a60-144eed92e6a9'")
            if [ "$count" = "0" ]; then recovered=1; break; fi
            sleep 2
          done
          test "$recovered" = "1"
          docker compose -f docker/compose.yml --profile test run -T --rm \
            -e PERITIAL_TEST_RESTART=1 \
            -e PERITIAL_TEST_S3_ENDPOINT=http://seaweedfs:8333 \
            tests dotnet test tests/backend/Peritial.Infrastructures.Tests/Peritial.Infrastructures.Tests.csproj \
            --filter FullyQualifiedName~UploadRestartContractTests.Restarted_worker_removed_orphan_and_released_pending_key \
            --logger "console;verbosity=normal"
      - name: SIGKILL API during a real S3 body transfer and reconcile after restart
        run: bash tests/chaos/run_mid_put.sh
      - name: API diagnostics on failed full-stack tests (no tokens or secret values)
        if: failure()
        run: docker compose -f docker/compose.yml logs --tail=160 api
      - if: always()
        run: docker compose -f docker/compose.yml -f docker/compose.chaos.yml --profile azure-test --profile chaos down -v
  database-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: PostgreSQL backup and restore to a distinct new server
        run: bash tests/backup/run_postgres_restore.sh
      - name: Legacy PostgreSQL baseline with verified backup and data preservation
        run: bash tests/backup/run_legacy_adoption.sh
      - name: Pre-lease legacy upgrade with verified backup and pending intents
        run: bash tests/backup/run_prelease_adoption.sh
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check / validate
        run: |
          terraform -chdir=infra fmt
          terraform -chdir=infra init -backend=false
          terraform -chdir=infra validate
