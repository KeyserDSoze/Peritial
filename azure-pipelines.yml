# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
- master

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    command: 'restore'
    restoreSolution: '$(solution)'
    feedsToUse: 'select'
    vstsFeed: '9072218a-afc6-4668-aee7-e7769e98c15f'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    msbuildArgs: '/t:publish /p:outputpath="$(build.artifactstagingdirectory)\\"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    clean: true
    msbuildArchitecture: 'x64'

- task: ExtractFiles@1
  inputs:
    archiveFilePatterns: '$(build.artifactstagingdirectory)/*.zip'
    destinationFolder: '$(Agent.BuildDirectory}/Temp'
    cleanDestinationFolder: true

- task: CopyFiles@2
  inputs:
    SourceFolder: '$(Agent.BuildDirectory)\\Temp\\Content\\D_C\\a\\1\\s\\src\\mywebApi\\obj\\Release\\netcoreapp3.1\\PubTmp\\Out'
    Contents: '**'
    TargetFolder: '$(Agent.BuildDirectory)/Temp'

- task: ArchiveFiles@2
  inputs:
    rootFolderOrFile: '$(Agent.BuildDirectory)/Temp'
    includeRootFolder: true
    archiveType: 'zip'
    archiveFile: '$(Agent.ArtifactStagingDirectory)/Site'
    replaceExistingArchive: true

- task: PublishBuildArtifacts@1
  displayName: 'Publish Artifact: drop'
  inputs:
    pathtoPublish: '$(Build.ArtifactStagingDirectory)\\Site\\' 
    artifactName: 'strategy' 