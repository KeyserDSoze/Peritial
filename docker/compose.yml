name: peritial
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_DB: peritial, POSTGRES_USER: peritial, POSTGRES_PASSWORD: local-only-postgres}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data", "../scripts/db/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro", "../scripts/db/002_dev_app_role.sql:/docker-entrypoint-initdb.d/002_dev_app_role.sql:ro"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U peritial -d peritial"], interval: 5s, timeout: 3s, retries: 20}
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    environment:
      AWS_ACCESS_KEY_ID: localminio
      AWS_SECRET_ACCESS_KEY: local-only-minio-secret
      S3_BUCKET: peritial
      WEED_ADMIN_PASSWORD: local-only-admin
    ports: ["8333:8333"]
    volumes: ["seaweeddata:/data"]
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    environment: {KC_HOSTNAME: "http://localhost:8081", KC_BOOTSTRAP_ADMIN_USERNAME: localadmin, KC_BOOTSTRAP_ADMIN_PASSWORD: local-only-admin}
    ports: ["8081:8080"]
    volumes: ["./keycloak/peritial-realm.json:/opt/keycloak/data/import/peritial-realm.json:ro"]
  api:
    build: {context: .., dockerfile: src/backend/Applications/Dockerfile}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=peritial;Username=peritial_app;Password=local-only-app
      Database__Bootstrap: "false"
      Auth__Authority: http://localhost:8081/realms/peritial
      Auth__MetadataAddress: http://keycloak:8080/realms/peritial/.well-known/openid-configuration
      Auth__DevelopmentBackchannelOrigin: http://keycloak:8080
      Auth__Audience: peritial-api
      Auth__Resource: http://localhost:8080
      Auth__RequireHttpsMetadata: "false"
      Storage__Provider: Minio
      Storage__Minio__Endpoint: http://seaweedfs:8333
      Storage__Minio__AccessKey: localminio
      Storage__Minio__SecretKey: local-only-minio-secret
      Storage__Minio__Bucket: peritial
      Cors__Origin: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      seaweedfs: {condition: service_started}
      keycloak: {condition: service_started}
  frontend:
    build: {context: .., dockerfile: src/frontend/Dockerfile}
    environment: {API_UPSTREAM: "http://api:8080"}
    ports: ["5173:80"]
    depends_on: [api]
  tests:
    profiles: ["test"]
    image: mcr.microsoft.com/dotnet/sdk:10.0
    working_dir: /repo
    volumes: ["..:/repo"]
    environment: {PERITIAL_TEST_POSTGRES: "Host=postgres;Port=5432;Database=peritial;Username=peritial;Password=local-only-postgres"}
    command: ["dotnet", "test", "Peritial.slnx"]
    depends_on:
      postgres: {condition: service_healthy}
volumes:
  pgdata:
  seaweeddata:
