server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $proxy_host; proxy_set_header Authorization $http_authorization; }
  location /mcp { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $proxy_host; proxy_set_header Authorization $http_authorization; }
  location /health/ { proxy_pass ${API_UPSTREAM}; proxy_set_header Host $proxy_host; }
  location / { try_files $uri $uri/ /index.html; }
}