# Additional overlay ON TOP OF docker/compose.observability.yml.
# For a disposable, fully local OTLP -> Collector -> Prometheus test:
#   docker compose -f docker/compose.yml -f docker/compose.observability.yml \
#     -f docker/compose.prometheus.yml up -d
# Never use this demo for production. OTLP/Prometheus HTTP has no authentication.
services:
  otel-collector:
    command: ["--config=/etc/otelcol/prometheus.yaml"]
    volumes:
      - ./otel-collector-prometheus-demo.yml:/etc/otelcol/prometheus.yaml:ro
    depends_on:
      prometheus: {condition: service_started}
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
      - --web.enable-otlp-receiver
      - --web.listen-address=0.0.0.0:9090
    read_only: true
    tmpfs:
      - /prometheus:rw,noexec,nosuid,size=128m,mode=1777
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    volumes:
      - ./prometheus-demo.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-readiness-alerts.yml:/etc/prometheus/readiness-alerts.yml:ro
    # Loopback only for CI's local PromQL probes; no 0.0.0.0 host binding.
    ports: ["127.0.0.1:19090:9090"]
