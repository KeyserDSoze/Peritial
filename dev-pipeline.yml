trigger:
- dev

resources:
  repositories:
  - repository: templates
    type: git
    name: templates

stages:
- template: prepare_tooling.yml@templates
  parameters:
    vmImage: 'ubuntu-latest'
    restoreBuildProjects: 'Expertiser.Portal/*.csproj'
    buildConfiguration: 'Debug'
    targetFramework: 'netcoreapp3.1'