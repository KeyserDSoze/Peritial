trigger:
- dev

resources:
  repositories:
  - repository: Expertisier
    type: git
    name: Expertisier.Pipeline

stages:
- template: dev-pipeline.yml@main
  parameters:
    vmImage: 'ubuntu-latest'
    restoreBuildProjects: 'Expertiser.Portal/*.csproj'
    buildConfiguration: 'Debug'
    targetFramework: 'netcoreapp3.1'