trigger:
- release

resources:
  repositories:
  - repository: Expertisier
    type: git
    name: Expertisier.Pipeline

stages:
- template: template-pipeline.yml@Expertisier
  parameters:
    vmImage: 'ubuntu-latest'
    restoreBuildProjects: 'Expertiser.Portal/*.csproj'
    buildConfiguration: 'Release'
    targetFramework: 'netcoreapp3.1'