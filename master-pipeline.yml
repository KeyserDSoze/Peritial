name: $(Build.DefinitionName)_$(date:yyyy).$(date:MM).0.$(rev:rr)

trigger:
  branches:
    include:
      - "master"

variables:
- name: 'srcPath'
  value: '$(Build.SourcesDirectory)'

jobs:
- job: Build_Experty_PoC_Ubuntu_Docker
  displayName: "Build Experty PoC on Ubuntu"
  pool:
    vmImage: ubuntu-latest
  steps:
  - task: Docker@2
    displayName: Build and push Docker image
    inputs:
      containerRegistry: 'container-registry' # Define this service connection in your Azure DevOps project
      repository: 'experty'
      command: 'buildAndPush'
      Dockerfile: 'Dockerfile' # Adjust the path to your Dockerfile
      tags: |
        $(Build.BuildId)
        latest

  - task: AzureAppServiceManage@0
    inputs:
      azureSubscription: 'quantum-online'
      Action: 'Restart Azure App Service'
      WebAppName: 'experty'
